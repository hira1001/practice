<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fafd"><title>CodeQuest Academy</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafd;color:#1f1f1f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.card{width:min(440px,calc(100% - 32px));padding:28px;border:1px solid #c7d0df;border-radius:24px;background:#fff;text-align:center;box-shadow:0 2px 10px rgba(31,31,31,.08)}.mark{width:56px;height:56px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:#0b57d0;color:#fff;font-weight:900;font-size:20px}.spinner{width:32px;height:32px;margin:22px auto 0;border:3px solid #d3e3fd;border-top-color:#0b57d0;border-radius:50%;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#5f6368;line-height:1.7}.error{display:none;text-align:left}.error a{display:inline-block;margin-top:16px;color:#0b57d0;font-weight:700}</style></head><body><main class="card"><div class="mark">CQ</div><section id="loading"><h1>CodeQuest Academyを起動中</h1><p>iPhone Safari互換モードで読み込んでいます。</p><div class="spinner"></div></section><section class="error" id="error"><h1>読み込みに失敗しました</h1><p id="message">通信状態を確認して、再読み込みしてください。</p><a href="javascript:location.reload()">もう一度読み込む</a></section></main><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>(function(){function fail(msg){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';document.getElementById('message').textContent=msg||'通信状態を確認して、再読み込みしてください。'}function start(){if(!window.pako){fail('展開ライブラリを読み込めませんでした。通信状態を確認してください。');return}var xhr=new XMLHttpRequest();xhr.open('GET','index.html?v='+Date.now(),true);xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status<200||xhr.status>=300){fail('アプリ本体を取得できませんでした。');return}try{var match=xhr.responseText.match(/atob\(['\"]([^'\"]+)['\"]\)/);if(!match)throw new Error('圧縮データが見つかりません');var raw=atob(match[1]);var bytes=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);var html=window.pako.ungzip(bytes,{to:'string'});document.open();document.write(html);document.close()}catch(e){fail('アプリの展開に失敗しました: '+e.message)}};xhr.onerror=function(){fail('ネットワーク接続を確認してください。')};xhr.send()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();</script></body></html>
